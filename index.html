<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Super Star</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #070b14;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      position: fixed;
      left: 0;
      top: 0;
      touch-action: none;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const ROUND = 20;
  const BTN = 68;
  const BTN_Y = 76;

  const dust = Array.from({ length: 48 }, () => ({
    x: Math.random(),
    y: Math.random(),
    s: Math.random() * 1.7 + 0.4,
    a: Math.random() * 0.35 + 0.12
  }));

  const input = { keyLeft: false, keyRight: false };
  const touches = new Map();
  const player = { x: 0, y: 0, r: 22 };
  let W = 0;
  let H = 0;
  let dpr = 1;
  let state = "ready";
  let endReason = "";
  let endedAt = 0;
  let elapsed = 0;
  let score = 0;
  let spawnAcc = 0;
  let shake = 0;
  let pulse = 0;
  let last = 0;
  let objects = [];
  let popups = [];

  function resize() {
    const view = window.visualViewport;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(280, Math.round(view ? view.width : window.innerWidth));
    H = Math.max(280, Math.round(view ? view.height : window.innerHeight));
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    player.y = H - Math.max(86, Math.min(128, H * 0.16));
    player.x = Math.max(player.r + 8, Math.min(W - player.r - 8, player.x || W / 2));
  }

  function reset() {
    state = "play";
    endReason = "";
    elapsed = 0;
    score = 0;
    spawnAcc = 0;
    pulse = 0;
    touches.clear();
    objects = [];
    popups = [];
    player.x = W / 2;
  }

  function finish(reason) {
    state = "end";
    endReason = reason;
    endedAt = performance.now();
    touches.clear();
    if (reason === "dead") {
      shake = 12;
      if (navigator.vibrate) navigator.vibrate(40);
    }
  }

  function buttonAt(x, y) {
    if (y < BTN_Y || y > BTN_Y + BTN) return null;
    if (x >= 14 && x <= 14 + BTN) return "left";
    if (x >= W - 14 - BTN && x <= W - 14) return "right";
    return null;
  }

  function holding(side) {
    for (const point of touches.values()) {
      if (buttonAt(point.x, point.y) === side) return true;
    }
    return false;
  }

  function pointFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (W / rect.width),
      y: (e.clientY - rect.top) * (H / rect.height)
    };
  }

  function spawn() {
    if (objects.length >= 3) return;
    const blocks = objects.filter((o) => o.kind === "block").length;
    const starChance = blocks >= 2 ? 1 : elapsed < 6 ? 0.78 : 0.55;
    const isStar = Math.random() < starChance;
    const r = isStar ? 15 : 17;
    objects.push({
      kind: isStar ? "star" : "block",
      x: r + 16 + Math.random() * (W - (r + 16) * 2),
      y: -28,
      r,
      vy: 250 + elapsed * 8,
      spin: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 2.4
    });
  }

  function update(dt) {
    if (shake > 0.4) shake *= 0.86;
    else shake = 0;
    if (pulse > 0) pulse = Math.max(0, pulse - dt * 2.4);

    for (const p of popups) p.life -= dt;
    popups = popups.filter((p) => p.life > 0);

    if (state !== "play") return;

    elapsed += dt;
    if (elapsed >= ROUND) {
      finish("time");
      return;
    }

    if (touches.size) {
      let x = player.x;
      for (const point of touches.values()) x = point.x;
      player.x = x;
    } else {
      const dir = (input.keyLeft ? -1 : 0) + (input.keyRight ? 1 : 0);
      player.x += dir * 520 * dt;
    }
    player.x = Math.max(player.r + 8, Math.min(W - player.r - 8, player.x));

    spawnAcc += dt;
    const interval = Math.max(0.48, 0.72 - elapsed * 0.01);
    if (spawnAcc >= interval) {
      spawnAcc = 0;
      spawn();
    }

    for (const o of objects) {
      o.y += o.vy * dt;
      o.spin += o.vr * dt;
      const dx = o.x - player.x;
      const dy = o.y - player.y;
      const reach = o.r + player.r - 2;
      if (dx * dx + dy * dy <= reach * reach) {
        if (o.kind === "star") {
          score += 1;
          pulse = 1;
          popups.push({ x: o.x, y: o.y, life: 0.7, text: "+1" });
          o.gone = true;
        } else {
          finish("dead");
          return;
        }
      } else if (o.y > H + 40) {
        o.gone = true;
      }
    }
    objects = objects.filter((o) => !o.gone);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawStar(x, y, r, spin) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(spin);
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const outer = -Math.PI / 2 + (i * Math.PI * 2) / 5;
      const inner = outer + Math.PI / 5;
      ctx.lineTo(Math.cos(outer) * r, Math.sin(outer) * r);
      ctx.lineTo(Math.cos(inner) * r * 0.42, Math.sin(inner) * r * 0.42);
    }
    ctx.closePath();
    ctx.fillStyle = "#ffd15a";
    ctx.fill();
    ctx.restore();
  }

  function drawButton(x, y, dir, active) {
    ctx.beginPath();
    ctx.arc(x + BTN / 2, y + BTN / 2, BTN / 2, 0, Math.PI * 2);
    ctx.fillStyle = active ? "rgba(255,255,255,0.34)" : "rgba(255,255,255,0.16)";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    const cx = x + BTN / 2 + dir * 2;
    const cy = y + BTN / 2;
    ctx.moveTo(cx + dir * 10, cy);
    ctx.lineTo(cx - dir * 8, cy - 12);
    ctx.lineTo(cx - dir * 8, cy + 12);
    ctx.closePath();
    ctx.fill();
  }

  function drawPlayer() {
    const squash = pulse * 0.18;
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.scale(1 + squash, 1 - squash);
    ctx.beginPath();
    ctx.arc(0, 0, player.r, 0, Math.PI * 2);
    ctx.fillStyle = "#3ee0ff";
    ctx.fill();
    ctx.fillStyle = "#06303a";
    ctx.beginPath();
    ctx.arc(-7, -2, 3.1, 0, Math.PI * 2);
    ctx.arc(7, -2, 3.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.strokeStyle = "#06303a";
    ctx.lineWidth = 2;
    ctx.arc(0, 4, 7, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
    ctx.restore();
  }

  function drawOverlay(title, lines) {
    ctx.fillStyle = "rgba(4, 8, 18, 0.62)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#f4f7ff";
    ctx.font = `700 ${Math.max(32, Math.min(58, W * 0.1))}px system-ui, sans-serif`;
    ctx.fillText(title, W / 2, H / 2 - 28);
    ctx.fillStyle = "#c5d0e6";
    ctx.font = "16px system-ui, sans-serif";
    lines.forEach((line, i) => {
      ctx.fillText(line, W / 2, H / 2 + 14 + i * 28);
    });
  }

  function draw() {
    const ox = shake ? (Math.random() - 0.5) * shake : 0;
    const oy = shake ? (Math.random() - 0.5) * shake : 0;
    ctx.setTransform(dpr, 0, 0, dpr, ox * dpr, oy * dpr);

    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#10182e");
    sky.addColorStop(1, "#241338");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    for (const star of dust) {
      ctx.globalAlpha = star.a;
      ctx.fillStyle = "#d5def2";
      ctx.fillRect(star.x * W, star.y * H, star.s, star.s);
    }
    ctx.globalAlpha = 1;

    for (const o of objects) {
      if (o.kind === "star") {
        drawStar(o.x, o.y, o.r, o.spin);
      } else {
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.rotate(o.spin);
        roundRect(-o.r, -o.r, o.r * 2, o.r * 2, 6);
        ctx.fillStyle = "#ff3b5c";
        ctx.fill();
        ctx.restore();
      }
    }

    drawPlayer();

    ctx.textAlign = "center";
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, p.life / 0.7);
      ctx.fillStyle = "#fff3c4";
      ctx.font = "700 20px system-ui, sans-serif";
      ctx.fillText(p.text, p.x, p.y - (0.7 - p.life) * 36);
    }
    ctx.globalAlpha = 1;

    if (state === "play") {
      const hudY = BTN_Y + BTN + 28;
      ctx.font = "600 16px system-ui, sans-serif";
      ctx.fillStyle = "#e7eeff";
      ctx.textAlign = "left";
      ctx.fillText("Score " + score, 16, hudY);
      ctx.textAlign = "right";
      ctx.fillText("Time " + Math.max(0, Math.ceil(ROUND - elapsed)), W - 16, hudY);
      ctx.textAlign = "center";
      ctx.fillStyle = "#9aa8c7";
      ctx.font = "13px system-ui, sans-serif";
      ctx.fillText("Arrow keys", W / 2, hudY);
    } else if (state === "ready") {
      drawOverlay("SUPER STAR", ["A fun arcade game", "Arrow keys to move", "PRESS ANY KEY"]);
    } else if (endReason === "dead") {
      drawOverlay("GAME OVER", ["Score: " + score, "Press R to restart"]);
    } else {
      drawOverlay("TIME UP", ["Score: " + score, "Press R to restart"]);
    }

    drawButton(14, BTN_Y, -1, holding("left") || input.keyLeft);
    drawButton(W - 14 - BTN, BTN_Y, 1, holding("right") || input.keyRight);
  }

  function loop(now) {
    if (!last) last = now;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* already gone */ }
    const p = pointFromEvent(e);
    if (state === "ready" || (state === "end" && performance.now() - endedAt > 400)) {
      reset();
    }
    if (state === "play") touches.set(e.pointerId, p);
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!touches.has(e.pointerId)) return;
    touches.set(e.pointerId, pointFromEvent(e));
  });

  function releasePointer(e) {
    touches.delete(e.pointerId);
  }

  canvas.addEventListener("pointerup", releasePointer);
  canvas.addEventListener("pointercancel", releasePointer);
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

  window.addEventListener("keydown", (e) => {
    const key = e.key.toLowerCase();
    if (e.key.startsWith("Arrow") || key === " ") e.preventDefault();
    if (state === "ready") reset();
    if (state === "end" && (key === "r" || key === "enter" || key === " ") && performance.now() - endedAt > 400) {
      reset();
    }
    if (key === "arrowleft" || key === "a") input.keyLeft = true;
    if (key === "arrowright" || key === "d") input.keyRight = true;
  });

  window.addEventListener("keyup", (e) => {
    const key = e.key.toLowerCase();
    if (key === "arrowleft" || key === "a") input.keyLeft = false;
    if (key === "arrowright" || key === "d") input.keyRight = false;
  });

  window.addEventListener("blur", () => {
    input.keyLeft = false;
    input.keyRight = false;
    touches.clear();
  });

  window.addEventListener("resize", resize);
  window.visualViewport?.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
